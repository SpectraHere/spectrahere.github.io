<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Letter</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =========================
           PAGE
        ========================= */

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(191, 205, 190, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(190, 185, 220, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #dfe8e1,
                    #e7e2ee,
                    #dce7ee
                );

            color: #38433d;
        }

        /* =========================
           SOFT BACKGROUND LIGHT
        ========================= */

        .background-glow {
            position: fixed;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.18);

            filter: blur(80px);

            animation: floatGlow 8s ease-in-out infinite alternate;

            pointer-events: none;
        }

        @keyframes floatGlow {
            from {
                transform: translate(-80px, -30px);
            }

            to {
                transform: translate(80px, 40px);
            }
        }

        /* =========================
           MAIN SCENE
        ========================= */

        .scene {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* =========================
           ENVELOPE
        ========================= */

        .envelope {
            width: 330px;
            height: 220px;

            position: relative;

            cursor: pointer;

            animation:
                swooshIn 1.4s cubic-bezier(.2,.8,.2,1) forwards,
                gentleFloat 4s ease-in-out 1.4s infinite;

            filter:
                drop-shadow(0 25px 35px rgba(61, 70, 68, 0.20));
        }

        @keyframes swooshIn {
            0% {
                opacity: 0;
                transform:
                    translateX(-120vw)
                    rotate(-18deg)
                    scale(0.8);
            }

            70% {
                opacity: 1;
                transform:
                    translateX(30px)
                    rotate(3deg)
                    scale(1.02);
            }

            100% {
                opacity: 1;
                transform:
                    translateX(0)
                    rotate(0deg)
                    scale(1);
            }
        }

        @keyframes gentleFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* =========================
           ENVELOPE BODY
        ========================= */

        .envelope-body {
            position: absolute;
            inset: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #f3efe4,
                    #e9e6d9
                );

            border: 1px solid rgba(255,255,255,0.8);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.9),
                inset 0 -10px 25px rgba(110, 115, 105, 0.08);
        }

        /* =========================
           ENVELOPE FLAP
        ========================= */

        .flap {
            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 165px solid transparent;
            border-right: 165px solid transparent;
            border-top: 120px solid #d6d6c5;

            z-index: 4;

            filter:
                drop-shadow(
                    0 2px 2px rgba(0,0,0,0.06)
                );
        }

        /* =========================
           LOWER ENVELOPE FOLDS
        ========================= */

        .fold-left {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-top: 110px solid transparent;
            border-right: 165px solid #dedccc;

            z-index: 3;
        }

        .fold-right {
            position: absolute;

            bottom: 0;
            right: 0;

            width: 0;
            height: 0;

            border-top: 110px solid transparent;
            border-left: 165px solid #dedccc;

            z-index: 3;
        }

        .fold-bottom {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 165px solid transparent;
            border-right: 165px solid transparent;
            border-bottom: 110px solid #d2d2c1;

            z-index: 4;
        }

        /* =========================
           LETTER INSIDE ENVELOPE
        ========================= */

        .hidden-letter {
            position: absolute;

            left: 50%;
            top: 18px;

            width: 230px;
            height: 150px;

            transform:
                translateX(-50%)
                translateY(0);

            background:
                linear-gradient(
                    135deg,
                    #fffdf8,
                    #f7f3ea
                );

            border-radius: 7px;

            box-shadow:
                0 8px 25px rgba(75, 80, 72, 0.18);

            z-index: 2;

            transition:
                transform 0.7s cubic-bezier(.2,.8,.2,1),
                opacity 0.5s ease;
        }

        .envelope:hover .hidden-letter {
            transform:
                translateX(-50%)
                translateY(-75px);
        }

        /* =========================
           LITTLE SEAL
        ========================= */

        .seal {
            position: absolute;

            left: 50%;
            top: 90px;

            transform: translateX(-50%);

            width: 52px;
            height: 52px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle,
                    #b7a7b9,
                    #9d899f
                );

            color: #f7f2f7;

            font-size: 21px;

            z-index: 7;

            box-shadow:
                0 5px 14px rgba(87, 74, 88, 0.25);

            transition:
                transform 0.25s ease;
        }

        .envelope:hover .seal {
            transform:
                translateX(-50%)
                scale(1.08);
        }

        /* =========================
           CLICK HINT
        ========================= */

        .hint {
            position: absolute;

            bottom: -70px;

            width: 100%;

            text-align: center;

            color: #657069;

            font-family:
                "Trebuchet MS",
                sans-serif;

            font-size: 14px;

            letter-spacing: 1px;

            opacity: 0;

            animation:
                fadeHint 1s ease 2s forwards;
        }

        @keyframes fadeHint {
            to {
                opacity: 0.8;
            }
        }

        /* =========================
           PASSWORD MODAL
        ========================= */

        .password-screen {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(48, 55, 52, 0.28);

            backdrop-filter: blur(12px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;

            z-index: 50;
        }

        .password-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .password-box {
            width: min(390px, 90%);

            padding: 38px;

            text-align: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(249, 248, 241, 0.96),
                    rgba(237, 238, 229, 0.94)
                );

            border: 1px solid rgba(255,255,255,0.8);

            box-shadow:
                0 30px 80px rgba(45, 54, 50, 0.25);

            transform: translateY(25px) scale(0.95);

            transition:
                transform 0.45s cubic-bezier(.2,.8,.2,1);
        }

        .password-screen.active .password-box {
            transform: translateY(0) scale(1);
        }

        .password-box h2 {
            margin-bottom: 10px;

            font-size: 27px;

            font-weight: normal;

            color: #4a554e;
        }

        .password-box p {
            margin-bottom: 22px;

            color: #7a837d;

            font-family: "Trebuchet MS", sans-serif;

            font-size: 14px;
        }

        .password-input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid #c8cec6;

            outline: none;

            background: rgba(255,255,255,0.7);

            color: #465049;

            font-size: 16px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .password-input:focus {
            border-color: #9dabb0;

            box-shadow:
                0 0 0 4px rgba(157,171,176,0.15);
        }

        .unlock-button {
            margin-top: 14px;

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #9eabb0,
                    #9d8fa7
                );

            color: white;

            font-size: 15px;

            letter-spacing: 0.5px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .unlock-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(94, 99, 103, 0.22);
        }

        .error {
            margin-top: 12px;

            color: #9b7070;

            font-family: "Trebuchet MS", sans-serif;

            font-size: 13px;

            opacity: 0;

            transition: opacity 0.2s ease;
        }

        .error.show {
            opacity: 1;
        }

        /* =========================
           FINAL LETTER
        ========================= */

        .letter-screen {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #dce7e0,
                    #e9e2eb,
                    #dce7ee
                );

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;

            z-index: 100;
        }

        .letter-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .paper {
            position: relative;

            width: min(650px, 92vw);
            min-height: 430px;

            padding: 65px 55px;

            border-radius: 6px;

            background:
                linear-gradient(
                    rgba(255,255,255,0.55),
                    rgba(255,255,255,0.55)
                ),
                repeating-linear-gradient(
                    0deg,
                    #f8f3e7 0px,
                    #f8f3e7 28px,
                    #f2ecdf 29px,
                    #f2ecdf 30px
                );

            box-shadow:
                0 35px 90px rgba(55, 63, 59, 0.24);

            border: 1px solid rgba(255,255,255,0.9);

            transform:
                translateY(50px)
                rotate(-2deg)
                scale(0.94);

            transition:
                transform 0.8s cubic-bezier(.2,.8,.2,1);

            overflow: hidden;
        }

        .letter-screen.active .paper {
            transform:
                translateY(0)
                rotate(0deg)
                scale(1);
        }

        .paper::before {
            content: "";

            position: absolute;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            background: rgba(180, 162, 183, 0.12);

            top: -70px;
            right: -60px;

            filter: blur(5px);
        }

        .paper::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: rgba(156, 177, 163, 0.12);

            bottom: -60px;
            left: -40px;

            filter: blur(5px);
        }

        .small-line {
            text-align: center;

            font-family: "Trebuchet MS", sans-serif;

            color: #9a9d94;

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 36px;
        }

        .message {
            text-align: center;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-size: clamp(64px, 11vw, 120px);

            font-weight: normal;

            color: #615566;

            transform: rotate(-3deg);

            text-shadow:
                1px 1px 0 rgba(255,255,255,0.75);

            animation: messageReveal 1.1s ease 0.3s both;
        }

        @keyframes messageReveal {
            0% {
                opacity: 0;
                transform:
                    translateY(20px)
                    rotate(-7deg)
                    scale(0.9);
            }

            100% {
                opacity: 1;
                transform:
                    translateY(0)
                    rotate(-3deg)
                    scale(1);
            }
        }

        .signature {
            margin-top: 35px;

            text-align: center;

            font-family:
                "Trebuchet MS",
                sans-serif;

            color: #8a918b;

            font-size: 13px;

            letter-spacing: 2px;
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            position: absolute;

            top: 24px;
            right: 24px;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: none;

            cursor: pointer;

            background: rgba(255,255,255,0.55);

            color: #67706a;

            font-size: 20px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .close-button:hover {
            transform: rotate(90deg);

            background: rgba(255,255,255,0.85);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .envelope {
                width: 280px;
                height: 185px;
            }

            .flap {
                border-left-width: 140px;
                border-right-width: 140px;
                border-top-width: 100px;
            }

            .fold-left {
                border-right-width: 140px;
                border-top-width: 92px;
            }

            .fold-right {
                border-left-width: 140px;
                border-top-width: 92px;
            }

            .fold-bottom {
                border-left-width: 140px;
                border-right-width: 140px;
                border-bottom-width: 92px;
            }

            .hidden-letter {
                width: 195px;
                height: 125px;
            }

            .seal {
                top: 73px;
            }

            .paper {
                padding: 55px 25px;
                min-height: 360px;
            }

            .message {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->

    <div class="background-glow"></div>


    <!-- Main Scene -->

    <main class="scene">

        <div
            class="envelope"
            id="envelope"
            title="Click the letter"
        >

            <div class="envelope-body"></div>

            <div class="hidden-letter"></div>

            <div class="flap"></div>

            <div class="fold-left"></div>
            <div class="fold-right"></div>
            <div class="fold-bottom"></div>

            <div class="seal">
                ✦
            </div>

            <div class="hint">
                click the letter
            </div>

        </div>

    </main>


    <!-- Password -->

    <div
        class="password-screen"
        id="passwordScreen"
    >

        <div class="password-box">

            <h2>
                A little secret
            </h2>

            <p>
                Enter the password to open the letter.
            </p>

            <input
                type="password"
                id="passwordInput"
                class="password-input"
                placeholder="Password"
                autocomplete="off"
            >

            <button
                class="unlock-button"
                id="unlockButton"
            >
                Unlock letter
            </button>

            <div
                class="error"
                id="error"
            >
                That's not the password.
            </div>

        </div>

    </div>


    <!-- Final Letter -->

    <div
        class="letter-screen"
        id="letterScreen"
    >

        <button
            class="close-button"
            id="closeButton"
        >
            ×
        </button>

        <div class="paper">

            <div class="small-line">
                a very important message
            </div>

            <div class="message">
                fuck u
            </div>

            <div class="signature">
                with absolutely no love ♡
            </div>

        </div>

    </div>


    <script>
        /* =========================
           ELEMENTS
        ========================= */

        const envelope =
            document.getElementById("envelope");

        const passwordScreen =
            document.getElementById("passwordScreen");

        const passwordInput =
            document.getElementById("passwordInput");

        const unlockButton =
            document.getElementById("unlockButton");

        const error =
            document.getElementById("error");

        const letterScreen =
            document.getElementById("letterScreen");

        const closeButton =
            document.getElementById("closeButton");


        /* =========================
           CLICK ENVELOPE
        ========================= */

        envelope.addEventListener("click", () => {

            passwordScreen.classList.add("active");

            setTimeout(() => {
                passwordInput.focus();
            }, 350);

        });


        /* =========================
           CHECK PASSWORD
        ========================= */

        function checkPassword() {

            const password =
                passwordInput.value;

            if (password === "demo") {

                error.classList.remove("show");

                passwordScreen.classList.remove("active");

                setTimeout(() => {

                    letterScreen.classList.add("active");

                }, 350);

            } else {

                error.classList.add("show");

                passwordInput.value = "";

                passwordInput.focus();

            }
        }


        /* =========================
           BUTTON
        ========================= */

        unlockButton.addEventListener(
            "click",
            checkPassword
        );


        /* =========================
           ENTER KEY
        ========================= */

        passwordInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {
                    checkPassword();
                }

            }
        );


        /* =========================
           CLOSE LETTER
        ========================= */

        closeButton.addEventListener(
            "click",
            () => {

                letterScreen.classList.remove("active");

            }
        );

    </script>

</body>
</html>
